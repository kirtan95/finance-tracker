server {
    listen 80;

    # API requests go to the backend service (see docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else is the React SPA; fall back to index.html so
    # react-router routes work on refresh / deep links.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
